<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario 1SMR</title>
    <style>
        table,th,td{
            border: 2px solid rgb(57, 12, 100);
            border-collapse: collapse;
        }
    </style>
</head>
<body>
    <h1>HORARIO 1ºSMR</h1>
    <table border="1">
        <tr>
            <th style="background-color: greenyellow;">Hora</th>
            <th style="background-color: brown;">Lunes</th>
            <th style="background-color: brown;">Martes</th>
            <th style="background-color: brown;">Miércoles</th>
            <th style="background-color: brown;">Jueves</th>
            <th style="background-color: brown;">Viernes</th>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">1ª</td>
            <td rowspan="3" style="background-color: aqua;">MMEQ</td>
            <td style="background-color: blueviolet;">FOL</td>
            <td rowspan="2" style="background-color: burlywood;">SOM</td>
            <td rowspan="2" style="background-color: chartreuse;">AWEB</td>
            <td rowspan="2" style="background-color: cornflowerblue;">REDL</td>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">2ª</td>
            <td rowspan="2" style="background-color: chartreuse;">AWEB</td>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">3ª</td>
            <td style="background-color: blueviolet;">FOL</td>
            <td style="background-color: cornflowerblue;">REDL</td>
            <td style="background-color: aqua;">MMEQ</td>
        </tr>
        <tr>
            <td colspan="6" text align="center" style="background-color: coral;">Recreo</td>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">4ª</td>
            <td style="background-color: yellow;">ING</td>
            <td rowspan="2" style="background-color: aqua;">MMEQ</td>
            <td style="background-color: blueviolet;">FOL</td>
            <td style="background-color: cornflowerblue;">REDL</td>
            <td style="background-color: aqua;">MMEQ</td>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">5ª</td>
            <td rowspan="2" style="background-color: cornflowerblue;">REDL</td>
            <td rowspan="2" style="background-color: chartreuse;">AWEB</td>
            <td rowspan="2" style="background-color: burlywood;">SOM</td>
            <td rowspan="2" style="background-color: burlywood;">SOM</td>
        </tr>
        <tr>
            <td style="background-color: goldenrod;">6ª</td>
            <td  style="background-color: yellow;">ING</td>
        </tr>
    </table>
</body>
</html>
